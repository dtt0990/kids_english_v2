<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>T&T English Advanced</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#2f6fed;--blue2:#eaf1ff;--ink:#213049;--muted:#6d788c;--line:#e4e9f1;--bg:#f6f8fc;--white:#fff;--green:#2da66f;--green2:#eaf8f1;--orange:#f39a3e;--orange2:#fff5e8;--purple:#7659df;--purple2:#f3efff;--red:#d94f4f;--shadow:0 10px 28px rgba(31,49,84,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,Arial,sans-serif;font-size:16px}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1160px;margin:auto;padding:18px 18px 104px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:54px;height:50px;border-radius:16px;background:linear-gradient(145deg,var(--blue),#1e55c7);position:relative;color:#fff;box-shadow:var(--shadow);flex:0 0 auto}.logo .l,.logo .r{position:absolute;top:8px;font-size:28px;font-weight:900;line-height:1}.logo .l{left:8px;transform:skew(-7deg)}.logo .r{right:7px;transform:skew(7deg)}.logo .a{position:absolute;left:50%;top:20px;transform:translateX(-50%);font-weight:900;color:#ffe58c}.brand h1{margin:0;font-size:21px}.brand small{color:var(--muted)}.pill{padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted)}
.hero{background:linear-gradient(135deg,#fff,#edf4ff);border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:var(--shadow);margin-bottom:20px}.kicker{text-transform:uppercase;letter-spacing:.8px;font-size:11px;font-weight:900;color:var(--blue)}.hero h2{font-size:30px;margin:7px 0 7px;line-height:1.16}.hero p{margin:0;color:var(--muted);line-height:1.55}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.section{margin-top:24px}.section h2{font-size:22px;margin:0 0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(31,49,84,.04)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.btn{border:0;border-radius:13px;min-height:46px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.purple{background:var(--purple)}.btn.small{min-height:38px;padding:8px 11px;font-size:13px}.muted{color:var(--muted)}.vi{color:#64738d;font-size:14px;line-height:1.45}.chip{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f1f4fa;font-size:12px;font-weight:700}.progress{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden;margin:11px 0}.progress i{display:block;height:100%;background:var(--green);border-radius:999px}.topic{transition:.18s;cursor:pointer}.topic:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.topic .icon{font-size:30px}.topic h3{margin:8px 0 3px;font-size:18px}.topic p{margin:0}.stageTitle{margin:24px 0 11px;font-size:19px;font-weight:900}.day{padding:18px}.day h3{margin:0 0 5px}.day p{min-height:48px;color:var(--muted);font-size:14px}.activityList{display:grid;gap:13px}.activity{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.activity h3{margin:0 0 7px}.activityHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.vocabGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.word{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcff}.word b{font-size:18px}.example{font-size:14px;color:#44516a;margin-top:8px;line-height:1.45}.audioRow{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.audioBtn{border:1px solid #cfd8e8;background:#fff;color:#315b9a;border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}.pattern{border-left:4px solid var(--blue);background:#f7f9fe;border-radius:0 12px 12px 0;padding:11px 13px;margin:9px 0}.grammar{background:var(--purple2);border-color:#ded5fb}.academic{background:var(--orange2);border-color:#f0dbb8}.reading{font-size:17px;line-height:1.8;background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:16px}.q{margin:10px 0;padding:12px;background:#fafbfe;border:1px solid var(--line);border-radius:12px}.answer{display:none;color:var(--green);font-weight:700;margin-top:8px}.recordBox{background:#f8faff;border:1px dashed #bac6d9;border-radius:14px;padding:17px;margin-top:12px}.timer{font-size:27px;font-weight:900;margin:5px 0}.checks{display:grid;gap:8px;margin-top:12px}.check{padding:10px 12px;border-radius:10px;background:#f5f7fb}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}input[type=text],textarea,select{width:100%;border:1px solid #cfd6e4;border-radius:12px;background:#fff;color:var(--ink);padding:12px}textarea{min-height:145px;resize:vertical;line-height:1.55}.notice{background:#fff8e8;border:1px solid #efdcad;border-radius:13px;padding:13px 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:25px}.skillbar{display:grid;grid-template-columns:110px 1fr 38px;gap:10px;align-items:center;margin:12px 0}.track{height:9px;background:#edf0f5;border-radius:999px;overflow:hidden}.track i{display:block;height:100%;background:var(--blue)}.bottomnav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}.navinner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.navbtn{border:0;background:transparent;padding:7px 3px;color:#748096;font-weight:700;font-size:12px}.navbtn span{font-size:21px;display:block;margin-bottom:2px}.navbtn.active{color:var(--blue)}.modal{position:fixed;inset:0;background:rgba(18,29,47,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modalCard{width:min(580px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:23px;box-shadow:0 28px 70px rgba(15,25,45,.28)}.levelGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:13px 0}.levelOpt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left}.levelOpt.selected{border:2px solid var(--blue);background:var(--blue2)}.hidden{display:none!important}
@media(max-width:760px){.grid2,.vocabGrid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero h2{font-size:25px}.app{padding:14px 13px 96px}.skillbar{grid-template-columns:95px 1fr 34px}.brand small{display:none}}
</style>
</head>
<body>
<div id="onboarding" class="modal">
  <div class="modalCard">
    <div class="brand"><div class="logo"><span class="l">T</span><span class="a">&amp;</span><span class="r">T</span></div><div><h1>T&amp;T English</h1><small>Academic &amp; Communication Foundation</small></div></div>
    <h2>Chào mừng em 👋</h2>
    <p class="muted">Bản nâng cao dành cho trẻ 8 đến 12 tuổi. Hãy nhập tên và chọn level phù hợp.</p>
    <label><b>Tên người học</b></label>
    <input id="nameInput" type="text" placeholder="Ví dụ: Minh">
    <div id="levelOptions" class="levelGrid"></div>
    <button class="btn" onclick="finishOnboarding()">Bắt đầu học</button>
  </div>
</div>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo"><span class="l">T</span><span class="a">&amp;</span><span class="r">T</span></div><div><h1>T&amp;T English</h1><small>Academic &amp; Communication Foundation</small></div></div>
    <div class="pill" id="userPill"></div>
  </div>
  <main id="view"></main>
</div>
<div class="bottomnav"><div class="navinner">
  <button class="navbtn active" data-view="home" onclick="go('home')"><span>🏠</span>Home</button>
  <button class="navbtn" data-view="learn" onclick="go('learn')"><span>📚</span>Learn</button>
  <button class="navbtn" data-view="review" onclick="go('review')"><span>⭐</span>Review</button>
  <button class="navbtn" data-view="progress" onclick="go('progress')"><span>🏆</span>Progress</button>
  <button class="navbtn" data-view="profile" onclick="go('profile')"><span>⚙️</span>Profile</button>
</div></div>
<script src="curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
